name: MedCalc native controller validation
on:
  push:
    branches: [medcalc-native-parity-r08, medcalc-parity-review-r15]
    paths:
      - 'src/medcalc-bench-verified/src/medcalc_bench_verified/native_*.py'
      - 'src/medcalc-bench-verified/src/medcalc_bench_verified/parity.py'
      - 'src/medcalc-bench-verified/src/medcalc_bench_verified/adapter.py'
      - 'src/medcalc-bench-verified/src/medcalc_bench_verified/main.py'
      - 'src/medcalc-bench-verified/scripts/**'
      - 'src/medcalc-bench-verified/src/medcalc_bench_verified/run_paired.py'
      - 'src/medcalc-bench-verified/tests/test_native.py'
      - 'src/medcalc-bench-verified/tests/native_*'
      - '.github/workflows/medcalc-native-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - working-directory: src/medcalc-bench-verified
        run: |
          uv sync --locked
          uv run python -m unittest discover -s tests -v
          mkdir -p "$GITHUB_WORKSPACE/native-evidence"
          uv run python scripts/check_generated_equivalence.py --output "$GITHUB_WORKSPACE/native-evidence/generator-equivalence.json"
          uv run medcalc-bench-verified --output-dir "$RUNNER_TEMP/native-pilot" --limit 3
      - name: Ensure Docker is running
        run: |
          if ! docker info >/dev/null 2>&1; then sudo systemctl start docker; fi
          docker info
      - name: Original-controller bridge with offline stub responses
        env:
          OPENAI_API_KEY: fake-test-credential-never-sent
        working-directory: src/medcalc-bench-verified
        run: |
          export PYTHONPATH="$PWD/tests"
          image=$(python3 -c 'import json; print(json.load(open("validation/parity-plan.proposed-r15.json"))["image"])')
          docker pull "$image"
          uv run harbor run --agent-kwarg "code_image=$image" -p "$RUNNER_TEMP/native-pilot" -a native_stub_agent:StubNativeAgent -m offline-stub -n 2 --max-retries 0 --jobs-dir "$GITHUB_WORKSPACE/native-evidence" --job-name stub
          uv run python scripts/assert_job.py "$GITHUB_WORKSPACE/native-evidence/stub" --expected-count 3 --reward 0
          uv run python scripts/assert_native_stub.py "$GITHUB_WORKSPACE/native-evidence/stub"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medcalc-native-stub-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-evidence/
          retention-days: 90
      - run: python -m unittest discover -s scripts/tests -v
      - run: git diff --check
