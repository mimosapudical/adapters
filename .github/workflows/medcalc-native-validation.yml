name: MedCalc native controller validation
on:
  push:
    branches: [medcalc-native-parity-r08, 'medcalc-parity-review-r*']
    paths:
      - 'src/medcalc-bench-verified/src/medcalc_bench_verified/native_*.py'
      - 'src/medcalc-bench-verified/src/medcalc_bench_verified/parity.py'
      - 'src/medcalc-bench-verified/src/medcalc_bench_verified/adapter.py'
      - 'src/medcalc-bench-verified/src/medcalc_bench_verified/main.py'
      - 'src/medcalc-bench-verified/scripts/**'
      - 'src/medcalc-bench-verified/src/medcalc_bench_verified/run_paired.py'
      - 'src/medcalc-bench-verified/tests/test_native.py'
      - 'src/medcalc-bench-verified/tests/native_*'
      - '.github/workflows/medcalc-native-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - working-directory: src/medcalc-bench-verified
        run: |
          uv sync --locked
          uv run python -m unittest discover -s tests -v
          mkdir -p "$GITHUB_WORKSPACE/native-evidence"
          uv run python scripts/check_generated_equivalence.py --output "$GITHUB_WORKSPACE/native-evidence/generator-equivalence.json"
      - name: Ensure Docker is running
        run: |
          if ! docker info >/dev/null 2>&1; then sudo systemctl start docker; fi
          docker info
      - name: Original-controller bridge with offline stub responses
        working-directory: src/medcalc-bench-verified
        run: bash scripts/smoke_native.sh "$GITHUB_WORKSPACE/native-evidence/smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medcalc-native-stub-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            native-evidence/generator-equivalence.json
            native-evidence/smoke/jobs/
          retention-days: 90
      - run: python -m unittest discover -s scripts/tests -v
      - run: git diff --check
