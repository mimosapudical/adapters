name: MedCalc final reference evidence
on:
  push:
    branches: [medcalc-native-parity-r08]
    paths: ['.github/workflows/medcalc-reference-finalize-r14.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  collect-complete-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Wait for the last original shards and the Docker recovery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 170); do
            original=$(gh api repos/mimosapudical/adapters/actions/runs/44413335549/jobs --jq '[.jobs[] | select(.name == "oracle (9)" or .name == "oracle (10)")]')
            failures=$(echo "$original" | jq '[.[] | select(.status == "completed" and .conclusion != "success")] | length')
            if [ "$failures" -gt 0 ]; then echo "An original shard failed; inspect its logs before proceeding."; exit 1; fi
            ready=$(echo "$original" | jq '[.[] | select(.conclusion == "success")] | length')
            recovery=$(gh api repos/mimosapudical/adapters/actions/runs/44444186906 --jq '.status + ":" + (.conclusion // "pending")')
            if [ "$recovery" = 'completed:failure' ] || [ "$recovery" = 'completed:cancelled' ]; then echo "Recovery did not pass."; exit 1; fi
            if [ "$ready" -eq 2 ] && [ "$recovery" = 'completed:success' ]; then break; fi
            if [ "$attempt" -eq 170 ]; then echo "Timed out waiting for complete evidence."; exit 1; fi
            echo "Waiting for reference-only jobs; no model API requests are made."
            sleep 30
          done
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 44413335549
          pattern: medcalc-44413335549-1-shard-*
          path: reference-evidence/original
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 44444186906
          pattern: medcalc-44444186906-1-shard-8
          path: reference-evidence/recovery
      - name: Require all 2,200 distinct reference and negative-control trials
        run: |
          python3 src/medcalc-bench-verified/scripts/aggregate_reference.py --original reference-evidence/original --recovery reference-evidence/recovery --output reference-evidence/reference-summary-r14.json
          echo 'Reference validation complete: 1,100 full-score oracle cases and 1,100 zero-score empty-answer controls. No live-model parity has been executed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medcalc-reference-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: reference-evidence/
          retention-days: 90
