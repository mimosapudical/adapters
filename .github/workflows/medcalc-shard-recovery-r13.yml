name: MedCalc shard 8 infrastructure recovery
on:
  push:
    branches: [medcalc-native-parity-r08]
    paths: ['.github/workflows/medcalc-shard-recovery-r13.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover-shard-8:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [8]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Ensure Docker is running
        run: |
          if ! docker info >/dev/null 2>&1; then sudo systemctl start docker; fi
          docker info
      - uses: astral-sh/setup-uv@v7
      - name: Generate 100 pinned tasks
        working-directory: src/medcalc-bench-verified
        run: |
          uv sync --locked
          uv run medcalc-bench-verified --output-dir "$GITHUB_WORKSPACE/generated" --shard-index ${{ matrix.shard }} --shard-count 11
      - name: Full-shard oracle then negative control
        working-directory: src/medcalc-bench-verified
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          uv run harbor run -p "$GITHUB_WORKSPACE/generated" -a oracle -n 2 --max-retries 0 --jobs-dir "$GITHUB_WORKSPACE/evidence" --job-name oracle-${{ matrix.shard }} 2>&1 | tee "$GITHUB_WORKSPACE/evidence/oracle.log"
          uv run python scripts/assert_job.py "$GITHUB_WORKSPACE/evidence/oracle-${{ matrix.shard }}" --expected-count 100 --reward 1
          uv run harbor run -p "$GITHUB_WORKSPACE/generated" -a nop -n 2 --max-retries 0 --jobs-dir "$GITHUB_WORKSPACE/evidence" --job-name nop-${{ matrix.shard }} 2>&1 | tee "$GITHUB_WORKSPACE/evidence/nop.log"
          uv run python scripts/assert_job.py "$GITHUB_WORKSPACE/evidence/nop-${{ matrix.shard }}" --expected-count 100 --reward 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medcalc-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: evidence/
          retention-days: 14
