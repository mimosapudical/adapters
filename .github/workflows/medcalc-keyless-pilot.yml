name: MedCalc local model pilot
on:
  push:
    branches: [medcalc-keyless-pilot-r24]
    paths:
      - '.github/workflows/medcalc-keyless-pilot.yml'
      - 'src/medcalc-bench-verified/scripts/keyless_pilot.py'
      - 'src/medcalc-bench-verified/src/medcalc_bench_verified/native_runtime.py'
permissions:
  contents: read
jobs:
  local-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        case-index: [0, 1, 2, 3, 4]
    env:
      MODEL: qwen2.5-coder:1.5b
      EXPECTED_MODEL_DIGEST: d7372fd828518a4d38b1eb196c673c31a85f2ed302b3d1e406c4c2d1b64a0668
      CASE_INDEX: ${{ matrix.case-index }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Load the local model on the CPU runner
        run: |
          if ! docker info >/dev/null 2>&1; then sudo systemctl start docker; fi
          docker run -d --name medcalc-ollama -p 127.0.0.1:11434:11434 \
            -e OLLAMA_NO_CLOUD=1 -e OLLAMA_NUM_PARALLEL=1 ollama/ollama:0.12.11@sha256:04c2fa3ba82b69ee211216b355b1d5dacfb7704b2cf734039bf126a857a5bc09
          mkdir "$GITHUB_WORKSPACE/keyless-evidence"
          curl --retry 20 --retry-all-errors --retry-delay 2 --max-time 5 -fsS \
            http://127.0.0.1:11434/api/version \
            > "$GITHUB_WORKSPACE/keyless-evidence/ollama-version.json"
          docker exec medcalc-ollama ollama pull "$MODEL"
          curl -fsS http://127.0.0.1:11434/api/tags > "$GITHUB_WORKSPACE/keyless-evidence/model-tags.json"
          jq -e --arg model "$MODEL" --arg digest "$EXPECTED_MODEL_DIGEST" 'any(.models[]; .name == $model and .digest == $digest)' \
            "$GITHUB_WORKSPACE/keyless-evidence/model-tags.json" >/dev/null
          docker inspect --format '{{.Image}}' medcalc-ollama > "$GITHUB_WORKSPACE/keyless-evidence/ollama-image.txt"
      - name: Run the same case on both harnesses
        working-directory: src/medcalc-bench-verified
        run: |
          uv sync --locked
          image=$(uv run --locked python -c 'import json; print(json.load(open("validation/parity-plan.proposed-r15.json"))["image"])')
          docker pull "$image"
          PYTHONPATH="$PWD/scripts" uv run --locked python scripts/keyless_pilot.py \
            --model "$MODEL" --case-index "$CASE_INDEX" --output "$GITHUB_WORKSPACE/keyless-evidence/pilot"
      - name: Collect the model server log
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/keyless-evidence"
          docker logs medcalc-ollama > "$GITHUB_WORKSPACE/keyless-evidence/ollama.log" 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medcalc-keyless-pilot-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.case-index }}
          path: |
            keyless-evidence/model-tags.json
            keyless-evidence/ollama-image.txt
            keyless-evidence/ollama-version.json
            keyless-evidence/ollama.log
            keyless-evidence/pilot/summary.json
            keyless-evidence/pilot/original-trace.json
            keyless-evidence/pilot/jobs/
          retention-days: 30
