version = "1.0"
artifacts = [{source = "/workspace/answer.txt", destination = "answer.txt"}]
[task]
name = "medcalc-bench-verified/{{TASK_ID}}"
authors = [{name = "MedCalc-Bench contributors"}]
[metadata]
difficulty = "medium"
category = "math"
tags = ["medical-calculation"]
[agent]
timeout_sec = 1200.0
[verifier]
timeout_sec = 30.0
environment_mode = "separate"
network_mode = "no-network"
[environment]
cpus = 1
memory_mb = 1024
storage_mb = 2048
build_timeout_sec = 300.0
